name: xue_hua_navite_background_downloader
description: "Native multi-task background downloader for Flutter across Android, iOS, macOS, Windows, and Linux, with pause/resume, persistent queue, checksum, and notifications."
version: 1.0.3
homepage: https://github.com/Matkurban/xue_hua_navite_background_downloader
repository: https://github.com/Matkurban/xue_hua_navite_background_downloader
issue_tracker: https://github.com/Matkurban/xue_hua_navite_background_downloader/issues

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_background_downloader
        pluginClass: XueHuaNaviteBackgroundDownloaderPlugin
      ios:
        pluginClass: XueHuaNaviteBackgroundDownloaderPlugin
      linux:
        pluginClass: XueHuaNaviteBackgroundDownloaderPlugin
      macos:
        pluginClass: XueHuaNaviteBackgroundDownloaderPlugin
      windows:
        pluginClass: XueHuaNaviteBackgroundDownloaderPluginCApi
